name: Validate Itsuki Sway Rice

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Pillow for wallpaper comparison
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check wallpaper duplicates
        run: python scripts/check-wallpaper-duplicates.py
      - name: Validate profiles
        run: bash scripts/validate-profiles.sh
