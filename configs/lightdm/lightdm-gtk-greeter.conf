[greeter]
background=/usr/share/backgrounds/debian-rice.jpg
user-background=false
theme-name=Itsuki-Rose
icon-theme-name=Adwaita
font-name=Sans 11
xft-antialias=true
xft-hintstyle=slight
xft-rgba=rgb
position=15%,start 50%,center
panel-position=top
clock-format=%a %d %b  %H:%M
indicators=~spacer;~clock;~spacer;~language;~session;~power
hide-user-image=false
round-user-image=true
